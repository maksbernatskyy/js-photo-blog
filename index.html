<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Blog</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Google Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+TAS+Beginner:wght@400..700&family=Nerko+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <!--CSS-->
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body class="position-relative">

    <!--Overlay-->
    <div id="overlay" class="d-none">
        <div class="bg-black position-absolute z-1 w-100 h-100 opacity-50" id="overlay"></div>
        <div id="photofield" class="position-absolute z-2 top-50 start-50 translate-middle w-50 text-center">
            <button id="button" class="btn btn-primary mb-5">Chiudi</button>
        </div>
    </div>

    <!--Intestazione-->
    <header id="header" class="py-3">
        <div class="text-center">
            <h1 id="title" class="text-uppercase fw-bold display-1">estate '24</h1>
        </div>
    </header>

    <!--Contenuto-->
    <main class="py-5">
        <div class="container">
            <div id="cards" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-5"></div>
        </div>
    </main>





    <!--JavaScript-->
    <script src="./assets/main.js"></script>
</body>

</html>
